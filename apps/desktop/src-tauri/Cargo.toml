[package]
name = "flowcontext-desktop"
version = "0.1.0"
description = "FlowContext cross-platform desktop shell"
authors = ["Camus"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flowcontext_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
thiserror = "2"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[dev-dependencies]
approx = "0.5"
