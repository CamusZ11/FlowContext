[package]
name = "flowcontext-cli"
version = "0.1.0"
edition = "2021"
default-run = "flowcontext"

[[bin]]
name = "flowcontext"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
keyring = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.21"
wiremock = "0.6"
